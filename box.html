<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BOX Example</title>
        <style>
            .box{
                width: 300px;
                height: 150px;
                background-color: lightblue;
                padding: 20px;
                border: 3px solid blue;
                margin: 30px;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <h2>Welcome</h2>
            <p>This is a CSS Box</p>
        </div>
    </body>
</html>
